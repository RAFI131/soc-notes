<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="310" viewBox="0 0 1500 310" role="img" aria-labelledby="title desc">
  <title id="title">SOC Notes — Cybersecurity Learning Journal</title>
  <desc id="desc">A dark navy cybersecurity-themed banner with blue and teal terminal motifs and the words SOC NOTES.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="0.55" stop-color="#0b1e32"/><stop offset="1" stop-color="#102b3e"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee" stop-opacity=".04"/><stop offset=".5" stop-color="#2563eb" stop-opacity=".24"/><stop offset="1" stop-color="#34d399" stop-opacity=".1"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#24506a" stroke-opacity=".34" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1500" height="310" rx="20" fill="url(#bg)"/>
  <rect width="1500" height="310" rx="20" fill="url(#grid)"/>
  <ellipse cx="1000" cy="145" rx="390" ry="180" fill="#0ea5e9" opacity=".12" filter="url(#soft)"/>
  <rect x="680" y="36" width="760" height="240" rx="14" fill="#081521" stroke="#1e536c" stroke-width="2"/>
  <rect x="680" y="36" width="760" height="34" rx="14" fill="#10283a"/>
  <circle cx="704" cy="53" r="5" fill="#fb7185"/><circle cx="722" cy="53" r="5" fill="#fbbf24"/><circle cx="740" cy="53" r="5" fill="#34d399"/>
  <text x="770" y="58" font-family="monospace" font-size="13" fill="#86a9bd">incident-console / learning-lab</text>
  <g font-family="monospace" font-size="18">
    <text x="720" y="105" fill="#5eead4">$ inspect --host</text><text x="915" y="105" fill="#9bb6c8">linux-lab</text>
    <text x="720" y="140" fill="#60a5fa">[01]</text><text x="772" y="140" fill="#d0e5f4">processes / logs</text><text x="1120" y="140" fill="#34d399">reviewed</text>
    <text x="720" y="175" fill="#60a5fa">[02]</text><text x="772" y="175" fill="#d0e5f4">network / indicators</text><text x="1120" y="175" fill="#fbbf24">correlate</text>
    <text x="720" y="210" fill="#60a5fa">[03]</text><text x="772" y="210" fill="#d0e5f4">case notes / evidence</text><text x="1120" y="210" fill="#a78bfa">document</text>
    <text x="720" y="245" fill="#5eead4">$</text><rect x="743" y="229" width="11" height="21" fill="#5eead4" opacity=".9"/>
  </g>
  <g transform="translate(90 65)">
    <path d="M0 12L14 0H38L52 12V40L38 52H14L0 40Z" fill="#0b2437" stroke="#22d3ee" stroke-width="2"/>
    <path d="M16 18L25 26L16 34M29 34H38" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="112" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="2" fill="#f1f7fc">SOC <tspan fill="#38bdf8">NOTES</tspan></text>
    <text x="2" y="154" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" letter-spacing="3" fill="#a6dff7">CYBERSECURITY LEARNING JOURNAL</text>
    <text x="3" y="195" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c0d1df">Linux  ·  SOC Analysis  ·  DFIR  ·  Threat Intelligence</text>
    <rect x="0" y="224" width="420" height="3" rx="1.5" fill="#38bdf8" opacity=".9"/>
